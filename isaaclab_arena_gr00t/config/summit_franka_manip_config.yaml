# Configuration for converting Summit Franka HDF5 dataset to LeRobot format.

# Input/Output paths
data_root: data/automoma
hdf5_name: "summit_franka_open_microwave_7221_setstate.hdf5"

# Task description
language_instruction: "Reach out to the microwave and open it."
task_index: 0

# Data field mappings (must match what the summit_franka recording produces)
# State: absolute joint positions from obs/joint_pos  (12 DOF)
state_name_sim: "joint_pos"
# Action: absolute joint positions from processed_actions (12 DOF)
action_name_sim: "processed_actions"

# Primary camera for video conversion (singular — matches Gr00tDatasetConfig.pov_cam_name_sim)
pov_cam_name_sim: "ego_topdown_rgb"

# LeRobot field names
state_name_lerobot: "observation.state"
action_name_lerobot: "action"
video_name_lerobot: "observation.images.ego_topdown"
task_description_lerobot: "annotation.human.action.task_description"

# Output configuration
fps: 50
chunks_size: 1000

# Metadata file paths
data_path: "data/chunk-{episode_chunk:03d}/episode_{episode_index:06d}.parquet"
video_path: "videos/chunk-{episode_chunk:03d}/{video_key}/episode_{episode_index:06d}.mp4"

# Config template paths
modality_template_path: "isaaclab_arena_gr00t/config/summit_franka/modality.json"
info_template_path: "isaaclab_arena_gr00t/config/summit_franka/info.json"

# Joint space configs
policy_joints_config_path: "isaaclab_arena_gr00t/config/summit_franka/gr00t_12dof_joint_space.yaml"
action_joints_config_path: "isaaclab_arena_gr00t/config/summit_franka/12dof_action_joint_space.yaml"
state_joints_config_path: "isaaclab_arena_gr00t/config/summit_franka/12dof_state_joint_space.yaml"

robot_type: "summit_franka"

# Image size (must match the actual camera resolution in summit_franka.py)
original_image_size: [240, 320, 3]
target_image_size: [240, 320, 3]

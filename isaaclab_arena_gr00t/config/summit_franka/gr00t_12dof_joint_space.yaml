# GR00T policy joint space for Summit Franka (12 DOF: 3 base + 7 arm + 2 gripper)
# For coordinated whole-body manipulation, the policy predicts actions for ALL joints.
joints:
  base:
    - base_x
    - base_y
    - base_z
  arm:
    - panda_joint1
    - panda_joint2
    - panda_joint3
    - panda_joint4
    - panda_joint5
    - panda_joint6
    - panda_joint7
  gripper:
    - panda_finger_joint1
    - panda_finger_joint2
